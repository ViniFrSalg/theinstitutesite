<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Public Magic Archive | The Institute</title><link rel="stylesheet" href="style.css"></head><body><div class="ambient-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div><main class="agent-dashboard"><section class="data-browser agent-magic-browser"><div class="browser-heading"><div><span class="badge">Public Access</span><h1>Kloerland Magic Archive</h1></div><div class="profile-actions"><a href="index.html" class="btn btn-secondary">HOME</a><a href="agents.html" class="btn btn-secondary">AGENTS</a></div></div><div class="browser-tools"><div class="form-group"><label for="search">Search</label><input id="search" type="search" placeholder="Find name, test, effect"></div><div class="form-group"><label for="type">Filter</label><select id="type"><option value="All">All Types</option><option value="Spell">Spells</option><option value="Weapon">Weapons</option><option value="Item">Items</option><option value="Equipment">Equipment</option></select></div><div class="form-group"><label for="element">Element</label><select id="element"><option value="All">All Elements</option><option value="Vida / Life">Green - Vida / Life</option><option value="Força / Strength">Red - Força / Strength</option><option value="Matéria / Matter">Yellow - Matéria / Matter</option><option value="Entropia / Entropy">Violet - Entropia / Entropy</option><option value="Fifth Element">Blue - Fifth Element</option><option value="???">Orange - ???</option></select></div></div><div class="records-list" id="records"></div></section></main><script>
let data=[];const $=x=>document.getElementById(x),esc=v=>String(v).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));function cls(e){return {'Vida / Life':'element-life','Força / Strength':'element-strength','Matéria / Matter':'element-matter','Entropia / Entropy':'element-entropy','Fifth Element':'element-fifth','???':'element-unknown'}[e]||'element-none'}function render(){let q=$('search').value.trim().toLowerCase(),t=$('type').value,e=$('element').value;let f=data.filter(r=>(t==='All'||r.type===t)&&(e==='All'||r.element===e)&&Object.values(r).join(' ').toLowerCase().includes(q));$('records').innerHTML=f.map(r=>`<article class="record-row read-only-record"><div class="record-main"><div class="record-tags"><span class="record-type">${esc(r.type)}</span>${r.type==='Spell'?`<span class="element-tag ${cls(r.element)}">${esc(r.element||'Unclassified')}</span>`:''}</div><h3>${esc(r.name)}</h3><p>${esc(r.effect||'No special effect recorded.')}</p></div><dl class="record-stats"><div><dt>Rarity</dt><dd>${esc(r.rarity||'-')}</dd></div><div><dt>Element</dt><dd>${esc(r.type==='Spell'?r.element||'-':'-')}</dd></div><div><dt>Range</dt><dd>${esc(r.range||'-')}</dd></div><div><dt>Duration</dt><dd>${esc(r.duration||'-')}</dd></div><div><dt>Test</dt><dd>${esc(r.test||'-')}</dd></div><div><dt>Damage</dt><dd>${esc(r.damage||'-')}</dd></div></dl></article>`).join('')||'<p>No matching records found.</p>'}fetch('magic-data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{data=x;render()}).catch(()=>{$('records').innerHTML='<p>Magic archive unavailable. Use a local server or deploy the site.</p>'});['search','type','element'].forEach(x=>$(x).addEventListener(x==='search'?'input':'change',render));
</script></body></html>
