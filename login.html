<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Login | The Institute</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-orbs"></div>
    <main class="login-page">
        <section class="glass-card login-panel">
            <span class="badge">Personnel Access</span>
            <div class="login-card">
                <h1>Agent Personnel Login</h1>
                <p>Enter your Serial Identification Code and password to access secure systems.</p>
                <div class="form-group">
                    <label for="serialCode">Serial Identification Code</label>
                    <input id="serialCode" type="text" placeholder="Enter your agent code" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
                </div>
                <button class="btn btn-primary login-btn" id="loginBtn">SIGN IN</button>
                <div class="login-message" id="loginMessage"></div>
            </div>
        </section>
    </main>

    <script>
        const ADMIN_AUTH_KEY = 'instituteAdminAuth';
        const AGENT_AUTH_KEY = 'instituteAgentAuth';

        function setAuthFlag(key) {
            let stored = false;

            try {
                localStorage.setItem(key, 'true');
                stored = true;
            } catch (error) {
                stored = false;
            }

            try {
                sessionStorage.setItem(key, 'true');
                stored = true;
            } catch (error) {
                stored = stored || false;
            }

            if (!stored) {
                document.cookie = `${key}=true; path=/; SameSite=Lax`;
            }
        }

        document.getElementById('loginBtn').addEventListener('click', function () {
            const serial = document.getElementById('serialCode').value.trim();
            const password = document.getElementById('password').value;
            const message = document.getElementById('loginMessage');

            if (!serial || !password) {
                message.textContent = 'Both fields are required.';
                return;
            }

            const normalizedSerial = serial.toLowerCase();

            if (normalizedSerial === 'admin' && password === 'kloerland') {
                setAuthFlag(ADMIN_AUTH_KEY);
                window.location.href = 'admin.html?adminAuth=kloerland';
            } else if (normalizedSerial === 'abc' && password === '123') {
                setAuthFlag(AGENT_AUTH_KEY);
                try { localStorage.setItem('instituteAgentId', normalizedSerial); } catch (error) {}
                window.location.href = 'agents.html';
            } else {
                message.textContent = 'Invalid Serial Identification Code or password.';
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });
    </script>
</body>
</html>
