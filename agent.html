<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agent Profile | The Institute</title><link rel="stylesheet" href="style.css"></head><body><div class="ambient-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div><main class="agent-dashboard"><section class="agent-card profile-card" id="profile"><div class="browser-heading"><div><span class="agent-tag" id="agentStatus">LOADING</span><h1 id="agentName">Agent Profile</h1></div><div class="profile-actions"><a href="agents.html" class="btn btn-secondary">ALL AGENTS</a><a href="magic-archive.html" class="btn btn-secondary">MAGIC ARCHIVE</a></div></div><div class="vitals-grid"><div class="vital-box"><span>HP</span><strong id="agentHp">—</strong></div><div class="vital-box"><span>DEF</span><strong id="agentDef">—</strong></div><div class="vital-box"><span>MONEY</span><strong id="agentMoney">—</strong></div></div><h2 class="profile-section-title">ATTRIBUTES</h2><div class="stats-grid" id="statsGrid"></div><div class="profile-sections"><section class="profile-list-card"><h2>PERÍCIAS</h2><ul id="pericias"></ul></section><section class="profile-list-card"><h2>HABILIDADES E ARMAS</h2><ul id="habilidadesArmas"></ul></section><section class="profile-list-card"><h2>INVENTÁRIO</h2><ul id="inventario"></ul></section></div><div class="agent-actions"><a href="login.html" class="btn btn-secondary" id="logoutLink">LOG OUT</a></div></section></main><script>
const AUTH='instituteAgentAuth'; function flag(k){try{if(localStorage.getItem(k)==='true')return true}catch(e){}try{if(sessionStorage.getItem(k)==='true')return true}catch(e){}return document.cookie.split('; ').some(c=>c===k+'=true')}
if(!flag(AUTH))location.replace('login.html');
const id=new URLSearchParams(location.search).get('id')||localStorage.getItem('instituteAgentId')||'abc';
function esc(v){return String(v).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));}
function renderList(id,items){document.getElementById(id).innerHTML=(items||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>No records available.</li>'}
fetch('agents-data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(agents=>{const a=agents.find(x=>x.id===id)||agents[0]; if(!a)throw Error(); document.title=a.name+' | The Institute'; document.getElementById('agentName').textContent=a.name;document.getElementById('agentStatus').textContent=a.status;document.getElementById('agentHp').textContent=a.hp.current+'/'+a.hp.max;document.getElementById('agentDef').textContent=a.def;document.getElementById('agentMoney').textContent=esc((a['dinheiro:']||[])[0]??'—'); const labels={pot:'POT',res:'RES',agi:'AGI',car:'CAR',int:'INT'};document.getElementById('statsGrid').innerHTML=Object.entries(labels).map(([k,l])=>`<div class="stat-box"><span>${l}</span><strong>${esc(a.stats[k]??'—')}</strong></div>`).join('');renderList('pericias',a.pericias);renderList('habilidadesArmas',a.habilidadesArmas);renderList('inventario',a.inventario);}).catch(()=>document.getElementById('profile').innerHTML='<h1>Agent record unavailable</h1><p>The requested profile could not be loaded.</p><a href="agents.html" class="btn btn-secondary">BACK TO AGENTS</a>');
document.getElementById('logoutLink').addEventListener('click',()=>{localStorage.removeItem(AUTH);localStorage.removeItem('instituteAgentId');sessionStorage.removeItem(AUTH);});
</script></body></html>
