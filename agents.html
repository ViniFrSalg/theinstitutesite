<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agents Database | The Institute</title><link rel="stylesheet" href="style.css"></head><body><div class="ambient-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div><main class="agent-dashboard"><section class="agent-card roster-card"><div class="browser-heading"><div><span class="badge">Personnel Database</span><h1>AGENTS</h1></div><a href="magic-archive.html" class="btn btn-secondary">PUBLIC MAGIC ARCHIVE</a></div><p>Authorized personnel registry. Select an agent to access their status and field records.</p><div id="agentsList" class="agents-grid"></div></section></main><script>
const list=document.getElementById('agentsList');
function esc(v){return String(v).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));}
fetch('agents-data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(agents=>{list.innerHTML=agents.map(a=>`<a class="agent-roster-entry" href="agent.html?id=${encodeURIComponent(a.id)}"><span class="agent-tag">${esc(a.status)}</span><h2>${esc(a.name)}</h2><p>HP ${a.hp.current}/${a.hp.max} · DEF ${esc(a.def)}</p><span class="profile-link">OPEN PROFILE →</span></a>`).join('')}).catch(()=>list.innerHTML='<p>Agent database unavailable.</p>');
</script></body></html>
