<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Data Center | The Institute</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="admin-shell">
        <section class="admin-topline">
            <div>
                <span class="badge">Admin Restricted</span>
                <h1>Kloerland Magic Data Center</h1>
                <p>Store and maintain RPG weapons, spells, equipment, and consumables from the Kloerland source sheet.</p>
            </div>
            <div class="admin-actions">
                <button class="btn btn-secondary" id="exportBtn">EXPORT JSON</button>
                <button class="btn btn-secondary" id="resetBtn">RESET SEED DATA</button>
                <a href="login.html" class="btn btn-primary" id="logoutBtn">LOG OUT</a>
            </div>
        </section>

        <section class="admin-metrics" aria-label="Magic database totals">
            <div class="metric-tile">
                <span id="totalCount">0</span>
                <p>Total Records</p>
            </div>
            <div class="metric-tile">
                <span id="spellCount">0</span>
                <p>Spells</p>
            </div>
            <div class="metric-tile">
                <span id="weaponCount">0</span>
                <p>Weapons</p>
            </div>
            <div class="metric-tile">
                <span id="itemCount">0</span>
                <p>Items</p>
            </div>
        </section>

        <section class="admin-workspace">
            <form class="data-form" id="entryForm">
                <input type="hidden" id="entryId">
                <h2 id="formTitle">New Record</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="entryType">Type</label>
                        <select id="entryType" required>
                            <option value="Spell">Spell</option>
                            <option value="Weapon">Weapon</option>
                            <option value="Item">Item</option>
                            <option value="Equipment">Equipment</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="entryName">Name</label>
                        <input id="entryName" type="text" required placeholder="Record name">
                    </div>
                    <div class="form-group">
                        <label for="entryRarity">Rarity</label>
                        <input id="entryRarity" type="text" placeholder="Common, Rare, Custom">
                    </div>
                    <div class="form-group">
                        <label for="entryElement">Element</label>
                        <select id="entryElement">
                            <option value="">None</option>
                            <option value="Vida / Life">Green - Vida / Life</option>
                            <option value="Força / Strength">Red - Força / Strength</option>
                            <option value="Matéria / Matter">Yellow - Matéria / Matter</option>
                            <option value="Entropia / Entropy">Violet - Entropia / Entropy</option>
                            <option value="Fifth Element">Blue - Fifth Element</option>
                            <option value="???">Orange - ???</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="entryRange">Range</label>
                        <input id="entryRange" type="text" placeholder="2, 5x5, ∞">
                    </div>
                    <div class="form-group">
                        <label for="entryDuration">Duration</label>
                        <input id="entryDuration" type="text" placeholder="Instantaneous, 2 turns">
                    </div>
                    <div class="form-group">
                        <label for="entryTest">Test</label>
                        <input id="entryTest" type="text" placeholder="Intelectualidade + Escopo">
                    </div>
                    <div class="form-group">
                        <label for="entryDamage">Damage</label>
                        <input id="entryDamage" type="text" placeholder="2d6+1">
                    </div>
                    <div class="form-group">
                        <label for="entryCrit">Critical Damage</label>
                        <input id="entryCrit" type="text" placeholder="2d8+2">
                    </div>
                    <div class="form-group form-wide">
                        <label for="entryEffect">Special Effect</label>
                        <textarea id="entryEffect" rows="4" placeholder="Effect, notes, cooldowns, and source cleanup notes"></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">SAVE RECORD</button>
                    <button class="btn btn-secondary" type="button" id="clearBtn">CLEAR</button>
                </div>
            </form>

            <section class="data-browser" aria-label="Stored magic data">
                <div class="browser-tools">
                    <div class="form-group">
                        <label for="searchInput">Search</label>
                        <input id="searchInput" type="search" placeholder="Find name, test, effect">
                    </div>
                    <div class="form-group">
                        <label for="typeFilter">Filter</label>
                        <select id="typeFilter">
                            <option value="All">All Types</option>
                            <option value="Spell">Spells</option>
                            <option value="Weapon">Weapons</option>
                            <option value="Item">Items</option>
                            <option value="Equipment">Equipment</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="elementFilter">Element</label>
                        <select id="elementFilter">
                            <option value="All">All Elements</option>
                            <option value="Vida / Life">Green - Vida / Life</option>
                            <option value="Força / Strength">Red - Força / Strength</option>
                            <option value="Matéria / Matter">Yellow - Matéria / Matter</option>
                            <option value="Entropia / Entropy">Violet - Entropia / Entropy</option>
                            <option value="Fifth Element">Blue - Fifth Element</option>
                            <option value="???">Orange - ???</option>
                        </select>
                    </div>
                </div>
                <div class="records-list" id="recordsList"></div>
            </section>
        </section>
    </main>

    <script>
        const ADMIN_AUTH_KEY = 'instituteAdminAuth';
        const STORAGE_KEY = 'kloerlandMagicRecords';
        const adminParams = new URLSearchParams(window.location.search);

        function storageAvailable(storage) {
            try {
                const testKey = '__instituteStorageTest';
                storage.setItem(testKey, testKey);
                storage.removeItem(testKey);
                return true;
            } catch (error) {
                return false;
            }
        }

        function setStoredFlag(key, value) {
            if (storageAvailable(localStorage)) {
                localStorage.setItem(key, value);
            }

            if (storageAvailable(sessionStorage)) {
                sessionStorage.setItem(key, value);
            }

            document.cookie = `${key}=${value}; path=/; SameSite=Lax`;
        }

        function getStoredFlag(key) {
            const cookieMatch = document.cookie
                .split('; ')
                .find((cookie) => cookie.startsWith(`${key}=`));

            if (storageAvailable(localStorage) && localStorage.getItem(key) === 'true') {
                return true;
            }

            if (storageAvailable(sessionStorage) && sessionStorage.getItem(key) === 'true') {
                return true;
            }

            return cookieMatch ? cookieMatch.split('=')[1] === 'true' : false;
        }

        if (adminParams.get('adminAuth') === 'kloerland') {
            setStoredFlag(ADMIN_AUTH_KEY, 'true');
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        let seedRecords = [];

        async function loadSeedRecords() {
            const response = await fetch('magic-data.json', { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`Unable to load magic-data.json: ${response.status}`);
            }

            const data = await response.json();
            if (!Array.isArray(data)) {
                throw new Error('magic-data.json must contain an array of records.');
            }

            seedRecords = data;
        }

        const fields = {
            id: document.getElementById('entryId'),
            type: document.getElementById('entryType'),
            name: document.getElementById('entryName'),
            rarity: document.getElementById('entryRarity'),
            element: document.getElementById('entryElement'),
            range: document.getElementById('entryRange'),
            duration: document.getElementById('entryDuration'),
            test: document.getElementById('entryTest'),
            damage: document.getElementById('entryDamage'),
            critical: document.getElementById('entryCrit'),
            effect: document.getElementById('entryEffect')
        };

        const entryForm = document.getElementById('entryForm');
        const recordsList = document.getElementById('recordsList');
        const searchInput = document.getElementById('searchInput');
        const typeFilter = document.getElementById('typeFilter');
        const elementFilter = document.getElementById('elementFilter');
        const formTitle = document.getElementById('formTitle');

        if (!getStoredFlag(ADMIN_AUTH_KEY)) {
            window.location.href = 'login.html';
        }

        function loadRecords() {
            const saved = storageAvailable(localStorage) ? localStorage.getItem(STORAGE_KEY) : null;
            if (!saved) {
                saveRecords(seedRecords);
                return [...seedRecords];
            }

            try {
                const records = JSON.parse(saved);
                const existingIds = new Set(records.map((record) => record.id));
                const seedById = new Map(seedRecords.map((record) => [record.id, record]));
                const upgradedRecords = records.map((record) => {
                    const seedRecord = seedById.get(record.id);

                    if (!seedRecord) {
                        return { element: '', ...record };
                    }

                    return {
                        ...seedRecord,
                        ...record,
                        element: record.element || seedRecord.element || ''
                    };
                });
                const upgradedIds = new Set(upgradedRecords.map((record) => record.id));
                const missingSeeds = seedRecords.filter((record) => !upgradedIds.has(record.id));

                if (missingSeeds.length > 0) {
                    const mergedRecords = [...upgradedRecords, ...missingSeeds];
                    saveRecords(mergedRecords);
                    return mergedRecords;
                }

                saveRecords(upgradedRecords);
                return upgradedRecords;
            } catch (error) {
                saveRecords(seedRecords);
                return [...seedRecords];
            }
        }

        function saveRecords(records) {
            if (storageAvailable(localStorage)) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            }
        }

        function getRecords() {
            return loadRecords();
        }

        function renderRecords() {
            const search = searchInput.value.trim().toLowerCase();
            const selectedType = typeFilter.value;
            const selectedElement = elementFilter.value;
            const records = getRecords();
            const filtered = records.filter((record) => {
                const matchesType = selectedType === 'All' || record.type === selectedType;
                const matchesElement = selectedElement === 'All' || record.element === selectedElement;
                const content = Object.values(record).join(' ').toLowerCase();
                return matchesType && matchesElement && content.includes(search);
            });

            document.getElementById('totalCount').textContent = records.length;
            document.getElementById('spellCount').textContent = records.filter((record) => record.type === 'Spell').length;
            document.getElementById('weaponCount').textContent = records.filter((record) => record.type === 'Weapon').length;
            document.getElementById('itemCount').textContent = records.filter((record) => record.type === 'Item' || record.type === 'Equipment').length;

            recordsList.innerHTML = filtered.map((record) => `
                <article class="record-row">
                    <div class="record-main">
                        <div class="record-tags">
                            <span class="record-type">${record.type}</span>
                            ${record.type === 'Spell' ? `<span class="element-tag ${getElementClass(record.element)}">${escapeHtml(record.element || 'Unclassified')}</span>` : ''}
                        </div>
                        <h3>${escapeHtml(record.name)}</h3>
                        <p>${escapeHtml(record.effect || 'No special effect recorded.')}</p>
                    </div>
                    <dl class="record-stats">
                        <div><dt>Rarity</dt><dd>${escapeHtml(record.rarity || '-')}</dd></div>
                        <div><dt>Element</dt><dd>${escapeHtml(record.type === 'Spell' ? record.element || '-' : '-')}</dd></div>
                        <div><dt>Range</dt><dd>${escapeHtml(record.range || '-')}</dd></div>
                        <div><dt>Duration</dt><dd>${escapeHtml(record.duration || '-')}</dd></div>
                        <div><dt>Test</dt><dd>${escapeHtml(record.test || '-')}</dd></div>
                        <div><dt>Damage</dt><dd>${escapeHtml(record.damage || '-')}</dd></div>
                        <div><dt>Critical</dt><dd>${escapeHtml(record.critical || '-')}</dd></div>
                    </dl>
                    <div class="record-actions">
                        <button type="button" class="mini-btn" data-action="edit" data-id="${record.id}">Edit</button>
                        <button type="button" class="mini-btn danger" data-action="delete" data-id="${record.id}">Delete</button>
                    </div>
                </article>
            `).join('');
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function getElementClass(element) {
            const elementMap = {
                'Vida / Life': 'element-life',
                'Força / Strength': 'element-strength',
                'Matéria / Matter': 'element-matter',
                'Entropia / Entropy': 'element-entropy',
                'Fifth Element': 'element-fifth',
                '???': 'element-unknown'
            };

            return elementMap[element] || 'element-none';
        }

        function clearForm() {
            entryForm.reset();
            fields.id.value = '';
            formTitle.textContent = 'New Record';
        }

        entryForm.addEventListener('submit', function (event) {
            event.preventDefault();
            const records = getRecords();
            const record = {
                id: fields.id.value || `record-${Date.now()}`,
                type: fields.type.value,
                name: fields.name.value.trim(),
                rarity: fields.rarity.value.trim(),
                element: fields.type.value === 'Spell' ? fields.element.value : '',
                range: fields.range.value.trim(),
                duration: fields.duration.value.trim(),
                test: fields.test.value.trim(),
                damage: fields.damage.value.trim(),
                critical: fields.critical.value.trim(),
                effect: fields.effect.value.trim()
            };

            if (!record.name) {
                fields.name.focus();
                return;
            }

            const existingIndex = records.findIndex((item) => item.id === record.id);
            if (existingIndex >= 0) {
                records[existingIndex] = record;
            } else {
                records.unshift(record);
            }

            saveRecords(records);
            clearForm();
            renderRecords();
        });

        recordsList.addEventListener('click', function (event) {
            const button = event.target.closest('button[data-action]');
            if (!button) return;

            const records = getRecords();
            const record = records.find((item) => item.id === button.dataset.id);
            if (!record) return;

            if (button.dataset.action === 'delete') {
                saveRecords(records.filter((item) => item.id !== record.id));
                renderRecords();
                return;
            }

            fields.id.value = record.id;
            fields.type.value = record.type;
            fields.name.value = record.name;
            fields.rarity.value = record.rarity;
            fields.element.value = record.element || '';
            fields.range.value = record.range;
            fields.duration.value = record.duration;
            fields.test.value = record.test;
            fields.damage.value = record.damage;
            fields.critical.value = record.critical;
            fields.effect.value = record.effect;
            formTitle.textContent = `Editing ${record.name}`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('clearBtn').addEventListener('click', clearForm);
        searchInput.addEventListener('input', renderRecords);
        typeFilter.addEventListener('change', renderRecords);
        elementFilter.addEventListener('change', renderRecords);

        document.getElementById('resetBtn').addEventListener('click', function () {
            saveRecords(seedRecords);
            clearForm();
            renderRecords();
        });

        document.getElementById('exportBtn').addEventListener('click', function () {
            const data = JSON.stringify(getRecords(), null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'kloerland-magic-data.json';
            link.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('logoutBtn').addEventListener('click', function () {
            if (storageAvailable(localStorage)) {
                localStorage.removeItem('instituteAdminAuth');
                localStorage.removeItem('instituteAgentAuth');
            }

            if (storageAvailable(sessionStorage)) {
                sessionStorage.removeItem('instituteAdminAuth');
                sessionStorage.removeItem('instituteAgentAuth');
            }

            document.cookie = 'instituteAdminAuth=; path=/; max-age=0';
            document.cookie = 'instituteAgentAuth=; path=/; max-age=0';
        });

        async function initAdminData() {
            try {
                await loadSeedRecords();
                renderRecords();
            } catch (error) {
                console.error(error);
                document.getElementById('recordsList').innerHTML = `
                    <article class="record-row">
                        <div class="record-main">
                            <h3>Magic archive unavailable</h3>
                            <p>The canonical magic-data.json file could not be loaded. Run the site through a web server and verify that magic-data.json is deployed beside admin.html.</p>
                        </div>
                    </article>
                `;
            }
        }

        initAdminData();
    </script>
</body>
</html>
