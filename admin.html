                    <div class="form-group">

                    <div class="form-group">

        function storageAvailable(storage) {
            try {
                const testKey = '__instituteStorageTest';
                storage.setItem(testKey, testKey);
                storage.removeItem(testKey);
                return true;
            } catch (error) {
                return false;
            }
        }

        function setStoredFlag(key, value) {
            if (storageAvailable(localStorage)) {
                localStorage.setItem(key, value);
            }

            if (storageAvailable(sessionStorage)) {
                sessionStorage.setItem(key, value);
            }

            document.cookie = `${key}=${value}; path=/; SameSite=Lax`;
        }

        function getStoredFlag(key) {
            const cookieMatch = document.cookie
                .split('; ')
                .find((cookie) => cookie.startsWith(`${key}=`));

            if (storageAvailable(localStorage) && localStorage.getItem(key) === 'true') {
                return true;
            }

            if (storageAvailable(sessionStorage) && sessionStorage.getItem(key) === 'true') {
                return true;
            }

            return cookieMatch ? cookieMatch.split('=')[1] === 'true' : false;
        }

        function loadRecords() {
            const saved = storageAvailable(localStorage) ? localStorage.getItem(STORAGE_KEY) : null;
            if (!saved) {
                saveRecords(seedRecords);
                return [...seedRecords];
            }

            try {
                const records = JSON.parse(saved);
                const existingIds = new Set(records.map((record) => record.id));
                const seedById = new Map(seedRecords.map((record) => [record.id, record]));
                const upgradedRecords = records.map((record) => {
                    const seedRecord = seedById.get(record.id);

                    if (!seedRecord) {
                        return { element: '', ...record };
                    }

                    return {
                        ...seedRecord,
                        ...record,
                        element: record.element || seedRecord.element || ''
                    };
                });
                const upgradedIds = new Set(upgradedRecords.map((record) => record.id));
                const missingSeeds = seedRecords.filter((record) => !upgradedIds.has(record.id));

                if (missingSeeds.length > 0) {
                    const mergedRecords = [...upgradedRecords, ...missingSeeds];
                    saveRecords(mergedRecords);
                    return mergedRecords;
                }

                saveRecords(upgradedRecords);
                return upgradedRecords;
            } catch (error) {
                saveRecords(seedRecords);
                return [...seedRecords];
            }
        }

        function saveRecords(records) {
            if (storageAvailable(localStorage)) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            }
        }

        function getRecords() {
            return loadRecords();
        }

        function renderRecords() {
            const search = searchInput.value.trim().toLowerCase();
            const selectedType = typeFilter.value;
            const selectedElement = elementFilter.value;
            const records = getRecords();
            const filtered = records.filter((record) => {
                const matchesType = selectedType === 'All' || record.type === selectedType;
                const matchesElement = selectedElement === 'All' || record.element === selectedElement;
                const content = Object.values(record).join(' ').toLowerCase();
                return matchesType && matchesElement && content.includes(search);
            });

            document.getElementById('totalCount').textContent = records.length;
            document.getElementById('spellCount').textContent = records.filter((record) => record.type === 'Spell').length;
            document.getElementById('weaponCount').textContent = records.filter((record) => record.type === 'Weapon').length;
            document.getElementById('itemCount').textContent = records.filter((record) => record.type === 'Item' || record.type === 'Equipment').length;

            recordsList.innerHTML = filtered.map((record) => `
                <article class="record-row">
                    <div class="record-main">
                        <div class="record-tags">
                            <span class="record-type">${record.type}</span>
                            ${record.type === 'Spell' ? `<span class="element-tag ${getElementClass(record.element)}">${escapeHtml(record.element || 'Unclassified')}</span>` : ''}
                        </div>
                        <h3>${escapeHtml(record.name)}</h3>
                        <p>${escapeHtml(record.effect || 'No special effect recorded.')}</p>
                    </div>
                    <dl class="record-stats">
                        <div><dt>Rarity</dt><dd>${escapeHtml(record.rarity || '-')}</dd></div>
                        <div><dt>Element</dt><dd>${escapeHtml(record.type === 'Spell' ? record.element || '-' : '-')}</dd></div>
                        <div><dt>Range</dt><dd>${escapeHtml(record.range || '-')}</dd></div>
                        <div><dt>Duration</dt><dd>${escapeHtml(record.duration || '-')}</dd></div>
                        <div><dt>Test</dt><dd>${escapeHtml(record.test || '-')}</dd></div>
                        <div><dt>Damage</dt><dd>${escapeHtml(record.damage || '-')}</dd></div>
                        <div><dt>Critical</dt><dd>${escapeHtml(record.critical || '-')}</dd></div>
                    </dl>
                    <div class="record-actions">
                        <button type="button" class="mini-btn" data-action="edit" data-id="${record.id}">Edit</button>
                        <button type="button" class="mini-btn danger" data-action="delete" data-id="${record.id}">Delete</button>
                    </div>
                </article>
            `).join('');
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function getElementClass(element) {
            const elementMap = {
                'Vida / Life': 'element-life',
                'Força / Strength': 'element-strength',
                'Matéria / Matter': 'element-matter',
                'Entropia / Entropy': 'element-entropy',
                'Fifth Element': 'element-fifth',
                '???': 'element-unknown'
            };

            return elementMap[element] || 'element-none';
        }

        function clearForm() {
            entryForm.reset();
            fields.id.value = '';
            formTitle.textContent = 'New Record';
        }

        entryForm.addEventListener('submit', function (event) {
            event.preventDefault();
            const records = getRecords();
            const record = {
                id: fields.id.value || `record-${Date.now()}`,
                type: fields.type.value,
                name: fields.name.value.trim(),
                rarity: fields.rarity.value.trim(),
                element: fields.type.value === 'Spell' ? fields.element.value : '',
                range: fields.range.value.trim(),
                duration: fields.duration.value.trim(),
                test: fields.test.value.trim(),
                damage: fields.damage.value.trim(),
                critical: fields.critical.value.trim(),
                effect: fields.effect.value.trim()
            };

            if (!record.name) {
                fields.name.focus();
                return;
            }

            const existingIndex = records.findIndex((item) => item.id === record.id);
            if (existingIndex >= 0) {
                records[existingIndex] = record;
            } else {
                records.unshift(record);
            }

            saveRecords(records);
            clearForm();
            renderRecords();
        });

        recordsList.addEventListener('click', function (event) {
            const button = event.target.closest('button[data-action]');
            if (!button) return;

            const records = getRecords();
            const record = records.find((item) => item.id === button.dataset.id);
            if (!record) return;

            if (button.dataset.action === 'delete') {
                saveRecords(records.filter((item) => item.id !== record.id));
                renderRecords();
                return;
            }

            fields.id.value = record.id;
            fields.type.value = record.type;
            fields.name.value = record.name;
            fields.rarity.value = record.rarity;
            fields.element.value = record.element || '';
            fields.range.value = record.range;
            fields.duration.value = record.duration;
            fields.test.value = record.test;
            fields.damage.value = record.damage;
            fields.critical.value = record.critical;
            fields.effect.value = record.effect;
            formTitle.textContent = `Editing ${record.name}`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('clearBtn').addEventListener('click', clearForm);
        searchInput.addEventListener('input', renderRecords);
        typeFilter.addEventListener('change', renderRecords);
        elementFilter.addEventListener('change', renderRecords);

        document.getElementById('resetBtn').addEventListener('click', function () {
            saveRecords(seedRecords);
            clearForm();
            renderRecords();
        });

        document.getElementById('exportBtn').addEventListener('click', function () {
            const data = JSON.stringify(getRecords(), null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'kloerland-magic-data.json';
            link.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('logoutBtn').addEventListener('click', function () {
            if (storageAvailable(localStorage)) {
                localStorage.removeItem('instituteAdminAuth');
                localStorage.removeItem('instituteAgentAuth');
            }

            if (storageAvailable(sessionStorage)) {
                sessionStorage.removeItem('instituteAdminAuth');
                sessionStorage.removeItem('instituteAgentAuth');
            }

            document.cookie = 'instituteAdminAuth=; path=/; max-age=0';
            document.cookie = 'instituteAgentAuth=; path=/; max-age=0';
        });

        renderRecords();
    </script>
</body>
</html>
